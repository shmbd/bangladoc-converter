name: Sync Backend to Hugging Face Spaces (Manual)

on:
  workflow_dispatch:

jobs:
  push-to-hf-space:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push backend folder to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID || 'Saddam-nib/bangladoc-api' }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_ID" ]; then
            echo "::error::Missing HF_TOKEN secret or HF_SPACE_ID repository variable (e.g. username/bangladoc-api)."
            exit 1
          fi
          TMP_DIR=$(mktemp -d)
          cp -r backend/. "$TMP_DIR/"
          rm -rf "$TMP_DIR/.git" "$TMP_DIR/.venv" "$TMP_DIR/vendor" "$TMP_DIR/storage" "$TMP_DIR/assets"
          cd "$TMP_DIR"
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy BanglaDoc Backend from GitHub (${GITHUB_SHA::7})"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}" main
