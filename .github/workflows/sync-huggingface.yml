name: Sync Backend to Hugging Face Spaces

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/sync-huggingface.yml"
  workflow_dispatch:

jobs:
  push-to-hf-space:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install --no-cache-dir --upgrade huggingface_hub hf_xet

      - name: Upload backend folder to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID || 'mbd-nib/bangladoc-api' }}
          GITHUB_SHA_SHORT: ${{ github.sha }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_ID" ]; then
            echo "::error::Missing HF_TOKEN secret or HF_SPACE_ID repository variable (e.g. username/bangladoc-api)."
            exit 1
          fi
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          space_id = os.environ["HF_SPACE_ID"]
          sha = os.environ.get("GITHUB_SHA_SHORT", "")[:7]

          api = HfApi(token=token)
          api.upload_folder(
              folder_path="backend",
              repo_id=space_id,
              repo_type="space",
              ignore_patterns=[
                  ".git",
                  ".git/**",
                  ".venv",
                  ".venv/**",
                  "vendor",
                  "vendor/**",
                  "storage",
                  "storage/**",
                  "**/__pycache__/**",
                  "*.pyc",
                  "*.sqlite3",
              ],
              delete_patterns=["app/**", "assets/**"],
              commit_message=f"Deploy BanglaDoc Backend from GitHub ({sha})",
          )
          print(f"Successfully synced backend/ to Hugging Face Space: {space_id}")
          EOF
